<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoke Ranker — Algorithmic Surf Intelligence</title>
  <meta name="description" content="Custom spatial surf spot ranking, headland wind-shadow modeling, and open forecast integration.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-color: #0b132b;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* Logo Container & Image Styling */
    .logo-container {
      margin-bottom: 2rem;
      width: 100%;
      max-width: 200px;
      height: auto;
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: translateY(-2px);
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Typography */
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #8d99ae;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(0, 180, 216, 0.1);
      border: 1px solid rgba(0, 180, 216, 0.3);
      color: #00b4d8;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #00b4d8;
      border-radius: 50%;
      box-shadow: 0 0 8px #00b4d8;
    }

    /* Footer Styling */
    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #6c757d;
    }

    footer a {
      color: #8d99ae;
      text-decoration: none;
      border-bottom: 1px dashed #6c757d;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    footer a:hover {
      color: #00b4d8;
      border-bottom-color: #00b4d8;
    }
  </style>
</head>
<body>

  <main>
    <!-- Centered External Logo Reference -->
    <div class="logo-container">
      <img src="logo.png" alt="StokeRanker Logo" class="logo-img" width="200" height="200">
    </div>

    <p class="subtitle">Precision surf intelligence combining GIS headland wind shadowing, marine forecasting, and spatial spot ranking.</p>

    <div class="badge">
      <span class="badge-dot"></span>
     Coming Soon... 
    </div>
  </main>

  <footer>
    &copy; Robert McLeay &bull; <a href="https://fearthecow.net" target="_blank" rel="noopener">fearthecow.net</a>
  </footer>

</body>
</html>
